<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Problem2Impact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="auth-shell">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to explore problems, track your solutions and teams.</p>

      <div class="auth-alert auth-alert--error" id="login-error" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="field" id="field-email">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
          <div class="field-error">Enter a valid email address.</div>
        </div>

        <div class="field" id="field-password">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
          <div class="field-error">Enter your password.</div>
        </div>

        <button type="submit" class="btn btn--primary btn--full" id="login-submit">Log in</button>
      </form>

      <p class="auth-footer-note">Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
