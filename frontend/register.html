<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Problem2Impact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="auth-shell">
    <div class="auth-card auth-card--wide">
      <h1>Create your account</h1>
      <p class="auth-sub">Choose the role that best describes you. Each role sees a form suited to it.</p>

      <div class="auth-alert auth-alert--error" id="register-error" role="alert"></div>
      <div class="auth-alert auth-alert--success" id="register-success" role="status"></div>

      <form id="register-form" novalidate>
        <div class="role-grid" id="role-grid" role="radiogroup" aria-label="Select your role">
          <div class="role-option">
            <input type="radio" name="role" id="role-citizen" value="citizen" checked />
            <label for="role-citizen">Common Citizen<span class="role-desc">Post societal problems</span></label>
          </div>
          <div class="role-option">
            <input type="radio" name="role" id="role-student" value="student" />
            <label for="role-student">Student<span class="role-desc">Build solutions, gain experience</span></label>
          </div>
          <div class="role-option">
            <input type="radio" name="role" id="role-researcher" value="researcher" />
            <label for="role-researcher">Researcher<span class="role-desc">Bring domain expertise</span></label>
          </div>
          <div class="role-option">
            <input type="radio" name="role" id="role-university" value="university" />
            <label for="role-university">University<span class="role-desc">Mobilize departments</span></label>
          </div>
          <div class="role-option">
            <input type="radio" name="role" id="role-industry" value="industry" />
            <label for="role-industry">Industry<span class="role-desc">Contribute resources & scale</span></label>
          </div>
        </div>

        <!-- Dynamic field sections; only the one matching the selected role is shown -->
        <div id="fields-common"></div>
        <div id="fields-role"></div>

        <button type="submit" class="btn btn--primary btn--full" id="register-submit">Create account</button>
      </form>

      <p class="auth-footer-note">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>
<script>
  window.P2I_BACKEND_URL = "https://sih-aj43.onrender.com/api"
</script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
