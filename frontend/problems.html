<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore Problems — Problem2Impact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/problems.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container page-section">
    <div class="page-header" style="border:none; padding-top:0; margin-bottom:20px;">
      <h1>Explore Problems</h1>
      <p class="lede">Browse real problems reported by the community, filter by sector or status, and support the ones that matter most.</p>
    </div>

    <form class="filters-bar" id="filters-form">
      <div class="field field--search">
        <label for="filter-search">Search</label>
        <input type="text" id="filter-search" placeholder="Search by keyword" />
      </div>
      <div class="field">
        <label for="filter-sector">Sector</label>
        <select id="filter-sector">
          <option value="">All sectors</option>
          <option value="agriculture">Agriculture</option>
          <option value="education">Education</option>
          <option value="health">Health</option>
          <option value="environment">Environment</option>
          <option value="infrastructure">Infrastructure</option>
          <option value="water">Water & Sanitation</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="filter-status">Status</label>
        <select id="filter-status">
          <option value="">Any status</option>
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="solved">Solved</option>
        </select>
      </div>
      <div class="field">
        <label for="filter-priority">Priority</label>
        <select id="filter-priority">
          <option value="">Any priority</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="field">
        <label for="filter-location">Location</label>
        <input type="text" id="filter-location" placeholder="City or region" />
      </div>
      <div class="field">
        <label for="filter-skills">Skills required</label>
        <input type="text" id="filter-skills" placeholder="e.g. Python" />
      </div>
      <button type="submit" class="btn btn--primary">Apply Filters</button>
    </form>

    <div class="results-summary" id="results-summary"></div>

    <div id="problems-list"><div class="spinner"></div></div>

    <div class="pagination" id="pagination"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; 2026 Problem2Impact</span>
      <span>Built to connect societal challenges with the people who can solve them.</span>
    </div>
  </footer>
<script>
  window.P2I_BACKEND_URL = "https://sih-aj43.onrender.com/api"
</script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/problems.js"></script>
</body>
</html>
